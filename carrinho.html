<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa Chapa - Carrinho</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <section class="carrinho">
    <h2>Carrinho</h2>
     <div id="lista-carrinho"></div>

  <div class="total">
    <h3>Total: R$ <span id="total">0.00</span></h3>
  </div>
  </section>

<div class="finalizar">
  <h3>Finalizar Pedido</h3>

  <div class="finalizar-form">
    <input
  type="text"
  id="cep"
  placeholder="CEP (somente números)"
  maxlength="8"
  onblur="buscarCEP()"
/>

<input
  type="text"
  id="endereco"
  placeholder="Endereço"
  readonly
/>

<input
  type="text"
  id="numero"
  placeholder="Número"
/>

<input
  type="text"
  id="complemento"
  placeholder="Complemento (opcional)"
/>


    <select id="pagamento" onchange="toggleTroco()">
      <option value="">Forma de pagamento</option>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Pix">Pix</option>
      <option value="Cartão de Crédito">Cartão de Crédito</option>
      <option value="Cartão de Débito">Cartão de Débito</option>
    </select>

    <input
      type="text"
      id="troco"
      placeholder="Troco para quanto?"
      class="troco"
    />

    <button class="btn-finalizar" onclick="finalizarPedido()">
      Enviar pedido no WhatsApp
    </button>
  </div>
</div>


   




  <footer>
    <p>© 2026 Burger House - Todos os direitos reservados</p>
  </footer>
  <a class="btn-voltar" href="index.html">
    <img src="./img/seta.png" width="60px">
  </a>
<script src="carrinho.js"></script>
</body>

</html>
